<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>みんなの予定に招待されました</title>
<meta name="apple-itunes-app" content="app-id=6836831443">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font: 1rem/1.7 "Hiragino Mincho ProN", "Yu Mincho", "Times New Roman", serif;
    color: #2c2824;
    background:
      radial-gradient(circle at 20% 0%, #fffaf3 0%, transparent 42%),
      linear-gradient(160deg, #f7f1e7 0%, #efe4d4 55%, #e7d8c4 100%);
  }
  main {
    max-width: 28rem;
    margin: 0 auto;
    padding: 3.2rem 1.25rem 2.5rem;
    text-align: center;
  }
  .mark {
    width: 4.6rem;
    height: 4.6rem;
    margin: 0 auto 1.1rem;
    border-radius: 1.3rem;
    background: #3d5344;
    color: #f6efe4;
    display: grid;
    place-items: center;
    font: 700 1.7rem/1 ui-rounded, "Hiragino Maru Gothic ProN", sans-serif;
    box-shadow: 0 10px 24px rgba(61, 83, 68, 0.18);
  }
  h1 {
    margin: 0 0 0.6rem;
    font-size: 1.65rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  p { margin: 0.45rem 0; color: #5c564e; }
  .card {
    margin: 1.4rem 0 0.4rem;
    padding: 1.1rem 1rem 1.2rem;
    background: rgba(255, 252, 247, 0.92);
    border: 1px solid rgba(92, 74, 52, 0.12);
    border-radius: 1.2rem;
    box-shadow: 0 12px 30px rgba(80, 58, 32, 0.06);
  }
  .label {
    margin: 0;
    font: 600 0.78rem/1.4 "Hiragino Sans", system-ui, sans-serif;
    letter-spacing: 0.14em;
    color: #7a7268;
  }
  .code {
    margin: 0.35rem 0 0;
    font: 700 2.5rem/1.15 ui-rounded, "Hiragino Maru Gothic ProN", sans-serif;
    letter-spacing: 0.22em;
    color: #2f4a3a;
  }
  .btn {
    display: inline-block;
    margin-top: 1.15rem;
    padding: 0.85rem 1.5rem;
    border-radius: 999px;
    background: #3d5344;
    color: #fff;
    text-decoration: none;
    font: 700 1rem/1.2 "Hiragino Sans", system-ui, sans-serif;
  }
  .btn:active { transform: translateY(1px); }
  small { color: #7a7268; font-family: "Hiragino Sans", system-ui, sans-serif; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">予</div>
  <h1>みんなの予定に<br>招待されました</h1>
  <p>家族や友だちのカレンダーに参加できます。アプリが入っていれば、このページからそのまま開けます。</p>
  <div class="card">
    <p class="label">招待コード</p>
    <p class="code" id="code">------</p>
  </div>
  <p>アプリの「グループ」から「招待コードを入力」でも参加できます。</p>
  <a class="btn" href="https://apps.apple.com/app/id6836831443">App Store でみんなの予定を入手</a>
  <p><small>コードの有効期限は発行から24時間です。</small></p>
</main>
<script>
var c = (new URLSearchParams(location.search).get("c") || "").replace(/\D/g, "").slice(0, 6);
if (c.length === 6) document.getElementById("code").textContent = c;
</script>
</body>
</html>
