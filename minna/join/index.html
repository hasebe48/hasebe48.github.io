<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>みんなの予定に招待されました</title>
<meta name="apple-itunes-app" content="app-id=6836831443">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    color: #2c2824;
    background:
      radial-gradient(circle at 20% 0%, #fffaf3 0%, transparent 42%),
      linear-gradient(160deg, #f7f1e7 0%, #efe4d4 55%, #e7d8c4 100%);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
  }
  main {
    max-width: 26rem;
    margin: 0 auto;
    padding: 4.2rem 1.4rem 2.5rem;
    text-align: center;
  }
  h1 {
    margin: 0;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 1.45rem;
    font-weight: 600;
    line-height: 1.5;
    letter-spacing: 0.02em;
  }
  .card {
    margin: 1.6rem 0 1.5rem;
    padding: 1.15rem 1rem 1.25rem;
    background: rgba(255, 252, 247, 0.92);
    border: 1px solid rgba(92, 74, 52, 0.12);
    border-radius: 1.2rem;
  }
  .label {
    margin: 0;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: #7a7268;
  }
  .code {
    margin: 0.4rem 0 0;
    font: 700 2.5rem/1.15 ui-rounded, "Hiragino Maru Gothic ProN", sans-serif;
    letter-spacing: 0.22em;
    color: #2f4a3a;
  }
  .note {
    margin: 0;
    font-size: 0.95rem;
    line-height: 1.7;
    color: #3f3a34;
  }
  .btn {
    display: inline-block;
    margin-top: 1.4rem;
    padding: 0.85rem 1.5rem;
    border-radius: 999px;
    background: #3d5344;
    color: #fff;
    text-decoration: none;
    font-weight: 700;
  }
  small {
    display: block;
    margin-top: 0.9rem;
    color: #7a7268;
    font-size: 0.8rem;
  }
</style>
</head>
<body>
<main>
  <h1>みんなの予定に招待されました</h1>
  <div class="card">
    <p class="label">招待コード</p>
    <p class="code" id="code">------</p>
  </div>
  <p class="note">
    アプリをインストールした状態で、<br>
    このリンクをもう一度開くか、<br>
    アプリから招待コードを入力すると参加できます。
  </p>
  <a class="btn" href="https://apps.apple.com/app/id6836831443">App Store でみんなの予定を入手</a>
  <small>コードの有効期限は発行から24時間です。</small>
</main>
<script>
var c = (new URLSearchParams(location.search).get("c") || "").replace(/\D/g, "").slice(0, 6);
if (c.length === 6) document.getElementById("code").textContent = c;
</script>
</body>
</html>
